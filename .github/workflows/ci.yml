name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake lcov
      - run: cmake -B build -DBUILD_TESTS=ON -DCMAKE_CXX_FLAGS="--coverage"
      - run: cmake --build build -j && ./build/tests
      - run: mkdir -p coverage && lcov -c -d build -o coverage/coverage.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  build:
    # The image is published only when the tests have passed.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ github.event.repository.updated_at }}